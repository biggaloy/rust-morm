# Step 02's throwaway spikes. Their own workspace, so nothing here reaches the
# real crates, and the whole folder is deleted when the step ends.
[workspace]
resolver = "3"
members = [
    "morm",
    "morm-macros",
    "bases-a",
    "bases-b",
    "models-a",
    "models-b",
    "models-unref",
    "app",
    "mgr",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99.1"
license = "BSD-3-Clause"
publish = false

[workspace.dependencies]
morm = { path = "morm" }
morm-macros = { path = "morm-macros" }
bases-a = { path = "bases-a" }
bases-b = { path = "bases-b" }
models-a = { path = "models-a" }
models-b = { path = "models-b" }
models-unref = { path = "models-unref" }
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "time", "sync"] }
tokio-postgres = { version = "0.7.18", features = ["with-uuid-1", "with-serde_json-1", "with-chrono-0_4"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
