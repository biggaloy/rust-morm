; The PgBouncer service for the pooler tests, in the mode production uses.
[databases]
postgres = host=127.0.0.1 port=5432 user=postgres dbname=postgres

[pgbouncer]
listen_addr = 127.0.0.1
listen_port = 6432
auth_type = any
pool_mode = transaction
default_pool_size = 5
logfile = /tmp/morm-pgbouncer.log
pidfile = /tmp/morm-pgbouncer.pid
