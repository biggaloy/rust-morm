# covers: R-0794, R-0957
name: bench

on:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  bench:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - run: mkdir bench-results
      - name: Run the benchmarks
        shell: bash
        run: cargo bench --locked --workspace --exclude morm-tests | tee bench-results/cargo-bench.txt
      - name: Install GNU time
        run: bash .github/scripts/install_time.sh
      - name: Measure binary size and RSS
        run: |
          cargo build --locked --release -p morm-admin
          /usr/bin/time -f %M -o bench-results/rss.txt target/release/morm-admin --version > /dev/null
      - name: Collect the measurements
        run: python3 .github/scripts/bench_metrics.py target/release/morm-admin bench-results/rss.txt bench-results/cargo-bench.txt bench-results/metrics.json
      - name: Fetch the last run's measurements
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/fetch_last_bench.sh
      - name: Compare with the last run
        shell: bash
        run: python3 .github/scripts/bench_compare.py bench-results/metrics.json previous/metrics.json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-results
          path: bench-results
          retention-days: 90
